name: Patch & release

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '17 3 * * *' # daily
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and re-release even if this version is already released
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APKEEP_VERSION: 1.1.0
  APKEEP_SHA256: badd7ad9fa7d2f32abe01eaf33b7ff086361a95bbc000a33bf44b630d4bf2140
  APKTOOL_VERSION: 3.0.3
  APKTOOL_SHA256: dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install apkeep and apktool
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/apkeep" \
            "https://github.com/EFForg/apkeep/releases/download/$APKEEP_VERSION/apkeep-x86_64-unknown-linux-gnu"
          curl -fsSL -o "$RUNNER_TEMP/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          echo "$APKEEP_SHA256  $RUNNER_TEMP/bin/apkeep" | sha256sum -c -
          echo "$APKTOOL_SHA256  $RUNNER_TEMP/apktool.jar" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/apkeep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "APKTOOL_JAR=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"

      - name: Download official APK
        id: download
        env:
          GP_EMAIL: ${{ secrets.GP_EMAIL }}
          GP_AAS_TOKEN: ${{ secrets.GP_AAS_TOKEN }}
          # APKPure fallback is on unless the repo variable ALLOW_APKPURE is set to 0.
          ALLOW_APKPURE: ${{ vars.ALLOW_APKPURE || '1' }}
        run: |
          apk=$(scripts/download.sh "$RUNNER_TEMP/download")
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          version=$("$bt/aapt2" dump badging "$apk" | sed -nE "1s/.*versionName='([^']*)'.*/\1/p")
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "source=$(cat "$RUNNER_TEMP/download/source")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-r$(cat PATCH_REVISION)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.download.outputs.tag }}
          UPSTREAM_SHA256: ${{ steps.download.outputs.sha256 }}
          FORCE: ${{ inputs.force }}
        run: |
          # Skip only if this tag was already built from this exact official APK.
          # Same version but a different APK (e.g. Play re-issued it) rebuilds and replaces the assets.
          body=$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)
          if [[ $body == *"$UPSTREAM_SHA256"* ]] && [ "$FORCE" != true ]; then
            echo "$TAG already released from upstream APK $UPSTREAM_SHA256"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes always build (to test patcher changes against the current official APK);
      # they only publish a release under the same rule as scheduled runs.
      - name: Restore signing key
        if: steps.check.outputs.skip != 'true' || github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to sign with a throwaway key (users could not update)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/patch.keystore"
          echo "KEYSTORE=$RUNNER_TEMP/patch.keystore" >> "$GITHUB_ENV"

      - name: Patch
        if: steps.check.outputs.skip != 'true' || github.event_name == 'push'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          APK: ${{ steps.download.outputs.apk }}
        run: |
          ./patch.sh "$APK"
          ./patch.sh --side-by-side "$APK"
          (cd work/out && sha256sum WindowsApp-*.apk > SHA256SUMS)

      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: WindowsApp-${{ steps.download.outputs.version }}-patched
          path: |
            work/out/WindowsApp-*.apk
            work/out/SHA256SUMS
          retention-days: 14

      - name: Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.download.outputs.tag }}
          VERSION: ${{ steps.download.outputs.version }}
          UPSTREAM_SHA256: ${{ steps.download.outputs.sha256 }}
          SOURCE: ${{ steps.download.outputs.source }}
        run: |
          cat > notes.md <<EOF
          Patched **Windows App $VERSION** (\`com.microsoft.rdc.androidx\`) that draws the remote desktop under the camera cutout.

          | File | Package | Installs |
          |---|---|---|
          | \`WindowsApp-$VERSION-side-by-side.apk\` | \`com.cyyself.windowsapp\` | next to the official app, as "Windows App Fullscreen" |
          | \`WindowsApp-$VERSION-nocutout.apk\` | \`com.microsoft.rdc.androidx\` | in place of the official app (uninstall it first) |

          Not affiliated with Microsoft. Work/school account sign-in may not work because the APK is re-signed.

          Official APK SHA-256: \`$UPSTREAM_SHA256\` (downloaded from $SOURCE, Microsoft signature verified)
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" work/out/WindowsApp-*.apk work/out/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" work/out/WindowsApp-*.apk work/out/SHA256SUMS \
              --title "Windows App $VERSION (fullscreen patch r$(cat PATCH_REVISION))" --notes-file notes.md
          fi
